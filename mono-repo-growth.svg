      .kpi-label, .tick, .month, .updated, .note { fill: #8b949e; font-family: "Comic Sans MS", "Chalkboard SE", "Bradley Hand", "Segoe Print", cursive; }
      .kpi-value, .axis-label, .value { fill: #f0f6fc; font-family: "Comic Sans MS", "Chalkboard SE", "Bradley Hand", "Segoe Print", cursive; font-weight: 700; }
      .kpi-value { font-size: 23px; }
      .kpi-label { font-size: 13px; }
      .tick, .month { font-size: 14px; }
      .value { fill: #ff8a91; font-size: 13px; }
      .axis-label { font-size: 16px; }
      .updated, .note { font-size: 12px; }
      .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 3 8; }
      .axis { stroke: #f0f6fc; stroke-width: 2.2; stroke-linecap: round; }
    </style>
  </defs>

