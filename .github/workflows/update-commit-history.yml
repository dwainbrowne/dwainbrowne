name: Update 2026 commit history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

concurrency:
  group: update-commit-history-2026
  cancel-in-progress: false

jobs:
  update:
    name: Refresh commit history on Dwain's OVH runner
    runs-on: [self-hosted, Linux, X64, ovh, debian, profile-stats]
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prove the expected self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "dwain-profile-ovh-01"
          test "$RUNNER_OS" = "Linux"
          . /etc/os-release
          test "$ID" = "debian"
          node --version
          gh --version

      - name: Require the private statistics credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "PROFILE_STATS_TOKEN is required to include authorized private commits." >&2
            exit 1
          fi
          gh auth status --hostname github.com

      - name: Generate the current chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_USERNAME: dwainbrowne
          CHART_YEAR: "2026"
        run: node generate-commit-history.mjs

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          node --check generate-commit-history.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("commit-history-2026.json", "utf8"))'
          test -s commit-history-2026.svg
          grep -q '<svg' commit-history-2026.svg
          grep -q '</svg>' commit-history-2026.svg

      - name: Publish a changed chart
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- commit-history-2026.json commit-history-2026.svg; then
            echo "The published chart is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-history-2026.json commit-history-2026.svg
          git commit -m "Update 2026 commit history"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
